# remap prefix from 'C-b' to 'C-x'
unbind C-b
set-option -g prefix C-x
bind-key C-x send-prefix

# split panes using \ and -
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# reload config file 
bind r source-file ~/.tmux.conf

# enable mouse
set -g mouse on

# make new window start in the current working directory of the active pane
bind c new-window -c "#{pane_current_path}"

# set escape time to instant
set -s escape-time 0

# right click to paste
# bind-key -n MouseDown3Pane run "tmux set-buffer \"$(powershell.exe -command Get-Clipboard)\"; tmux paste-buffer"

# reload config file with Prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# recursively move windows to fill missing gaps
bind-key M-r movew -r

# claude code settings (shift+enter for newline)
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

### DESIGN CHANGES ###

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# pane borders
set -g pane-border-style 'fg=colour240 bg=colour0'
set -g pane-active-border-style 'fg=colour51 bg=colour0'

# status bar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour0 fg=colour231 bold'  # dark background, bright foreground

# right status
set -g status-right '#[fg=colour231,bg=colour33] %d/%m #[fg=colour231,bg=colour33] %H:%M:%S '

# messages
set -g message-style 'fg=colour231 bg=colour33 bold'


### INSTALL PLUGINS ###

# List your plugins here (add them above the 'run' line!)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'jaclu/tmux-menus'

### PLUGIN SETTINGS ###
set -g @menus_trigger 'Space'

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
